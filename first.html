
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>


        <!-- PROJECT NAME -->

        <h1 class="logo">
            TaskFlow
        </h1>


        <!-- PRIORITY FILTERS -->

        <div class="priotityColors">

            <div class="color red"></div>

            <div class="color blue"></div>

            <div class="color green"></div>

            <div class="color orange"></div>

        </div>


        <!-- OPTIONS -->

        <div class="options">


            <!-- ADD -->

            <svg
                id="add"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="24"
                height="24"
                fill="currentColor"
            >

                <path
                    d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"
                ></path>

            </svg>


            <!-- DELETE -->

            <svg
                id="delete"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="24"
                height="24"
                fill="currentColor"
            >

                <path
                    d="M7 6V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7ZM9 4V6H15V4H9Z"
                ></path>

            </svg>


            <!-- SHOW ALL -->

            <svg
                id="all"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="24"
                height="24"
                fill="currentColor"
            >

                <path
                    d="M12.9998 3L12.9996 10.267L19.294 6.63397L20.294 8.36602L14.0006 11.999L20.294 15.634L19.294 17.366L12.9996 13.732L12.9998 21H10.9998L10.9996 13.732L4.70557 17.366L3.70557 15.634L9.99857 12L3.70557 8.36602L4.70557 6.63397L10.9996 10.267L10.9998 3H12.9998Z"
                ></path>

            </svg>


        </div>


    </nav>



    <!-- =========================
         TASK CONTAINER
    ========================== -->

    <div class="taskContainer">


        <!--
            JavaScript will
            dynamically create
            task tickets here.
        -->


    </div>



    <!-- =========================
         TASK ADDER
    ========================== -->

    <div class="taskAdder hide">


        <!-- TASK INPUT -->

        <textarea
            id="textarea"
            class="taskText"
            placeholder="Write your task here..."
        ></textarea>


        <!-- PRIORITY COLORS -->

        <div class="priotityColors2">


            <div
                class="color2 red border"
            ></div>


            <div
                class="color2 blue"
            ></div>


            <div
                class="color2 green"
            ></div>


            <div
                class="color2 orange"
            ></div>


        </div>


    </div>



    <!-- JAVASCRIPT -->

    <script src="./script.js"></script>


</body>

</html>
